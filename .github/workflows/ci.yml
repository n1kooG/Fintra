name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato (Prettier)
        run: npx prettier --check .

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Valores dummy: alcanza para que el build compile (SSG/tipos);
          # el build no llama a Supabase ni a la base de datos en si mismo.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Instalar Chromium para las pruebas E2E
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E (lo público, sin iniciar sesión)
        run: npx playwright test e2e/publico.spec.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
