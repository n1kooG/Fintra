<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#100f0d" />
    <title>Sin conexión · Fintra</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
        background: #100f0d;
        color: #e4e1d8;
        font-family: Georgia, "Times New Roman", serif;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 500;
      }
      p {
        margin: 0;
        max-width: 320px;
        color: #9a9689;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.6;
      }
      button {
        margin-top: 6px;
        padding: 0 0 2px;
        background: none;
        border: 0;
        border-bottom: 1px solid #e4e1d8;
        color: #e4e1d8;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Sin conexión</h1>
    <p>
      No pudimos conectarnos. Por seguridad Fintra no guarda tus datos financieros en este
      dispositivo, así que necesitas internet para verlos.
    </p>
    <button type="button" onclick="location.reload()">reintentar</button>
  </body>
</html>
